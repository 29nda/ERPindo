name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Syntax check ops scripts
        run: node --check scripts/seed-demo.mjs && node --check scripts/ai-probe.mjs

      - name: Build
        run: pnpm build

      - name: End-to-end smoke test (wrangler dev, local D1)
        run: pnpm smoke

  ui-sim:
    # Simulasi UI penuh (Fase 9b): klik-tembus browser nyata — sapu semua rute
    # + alur interaktif. Dipromosikan WAJIB pada Fase 9d setelah stabil
    # berturut-turut di CI.
    name: UI simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright-core install chromium

      - name: UI simulation (wrangler dev + Playwright)
        run: node scripts/ui-sim.mjs

  lint:
    # Dipromosikan WAJIB pada Fase 12a setelah migrasi ke flat config (ESLint 9)
    # dan basis kode terbukti bersih.
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # Fase 16t: menjaga kelas bug `{u("kunci")}` di dalam template literal —
      # di sana ia bukan JSX, jadi teksnya keluar harfiah ke layar/kertas
      # (struk POS sempat tercetak dengan tulisan `{u("subtotal")}`). Skrip
      # keluar dengan kode 1 HANYA untuk bug ini; sisa utang terjemahan cuma
      # dilaporkan dan tidak menggagalkan CI.
      # Fase 20m: glob DITURUNKAN ke subfolder. Sebelumnya `pages/*.tsx` saja,
      # sehingga `pages/settings/`, `pages/landing/`, dan `pages/panduan/` tidak
      # pernah tersapu sama sekali — 219 utang teks di halaman Pengaturan lolos
      # tanpa terlihat selama seluruh program dwibahasa Fase 19.
      - name: Penjaga i18n (panggilan u() harfiah)
        run: |
          shopt -s globstar
          node scripts/sapu-i18n.mjs apps/web/src/pages/**/*.tsx apps/web/src/components/**/*.tsx > /dev/null
        shell: bash

      # Fase 31a: kelas warna literal (`slate-*`, `dark:`) hanya boleh TURUN.
      # Tanpa gerbang ini, token semantik yang baru dipasang akan terkikis
      # kembali oleh halaman berikutnya yang menulis warna langsung — persis
      # yang membuat perombakan desain 17a & 18a tidak pernah terasa.
      - name: Penjaga warna (token semantik)
        run: node scripts/sapu-warna.mjs

      # Fase 33k: keputusan istilah di docs/glosarium.md. Tanpa gerbang ini ia
      # berumur persis sampai halaman berikutnya ditulis — string apa pun tetap
      # sah bagi tsc, eslint, dan smoke, jadi tidak ada yang bisa melihatnya.
      - name: Penjaga istilah (glosarium)
        run: node scripts/sapu-istilah.mjs

      # Fase 33k: bentuk kalimat — terjemahan Inggris dalam kurung, empty state
      # buntu, placeholder angka tanpa pemisah ribuan. Berambang seperti
      # sapu-warna: hanya boleh TURUN.
      - name: Penjaga gaya naskah
        run: node scripts/sapu-gaya.mjs

      # Fase 31e: Markdown tidak dikompilasi, jadi tautan mati tidak pernah
      # menghasilkan galat. Memadatkan 258 log fase meninggalkan 21 rujukan
      # menggantung sekaligus — dua di antaranya di dokumen yang justru dibaca
      # pemilik saat meluncurkan.
      - name: Penjaga tautan dokumen
        run: node scripts/periksa-tautan-dokumen.mjs

